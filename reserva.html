<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Alquiler</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card { max-width: 420px; margin: 40px auto; padding: 24px; background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
        .card input { width: 100%; padding: 10px; margin-bottom: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        .rapidos { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
        .rapidos button { padding: 8px 12px; border: 1px solid #0077b6; background: white; color: #0077b6; border-radius: 20px; cursor: pointer; }
        .rapidos button:hover { background: #e0f2fe; }
        #aviso { display: none; color: #c1121f; background: #fde8e8; padding: 10px; border-radius: 8px; }
        #btn { width: 100%; padding: 15px; background: #0077b6; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; }
        #btn:disabled { opacity: .6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📝 Datos del Cliente</h2>
        <p>Registrando <strong id="nombre-tabla">Tabla #...</strong></p>
        <p id="aviso"></p>
        <form id="reservaForm">
            <label for="cliente">Cliente</label>
            <input type="text" id="cliente" placeholder="Nombre del Cliente" required>

            <label for="minutos">Tiempo pagado (minutos)</label>
            <div class="rapidos">
                <button type="button" data-min="30">30 min</button>
                <button type="button" data-min="60">1 h</button>
                <button type="button" data-min="90">1 h 30</button>
                <button type="button" data-min="120">2 h</button>
            </div>
            <input type="number" id="minutos" min="5" step="5" value="60" required>

            <label for="monto">Monto S/</label>
            <input type="number" id="monto" min="0" step="0.01" placeholder="Precio que cobras" required>

            <label for="ref">Referencia Yape/Plin</label>
            <input type="text" id="ref" placeholder="Código de operación" required>

            <button type="submit" id="btn">GUARDAR Y FINALIZAR</button>
        </form>
        <br><a href="SurfFlow.html">Cancelar y volver</a>
    </div>
    <script src="api.js"></script>
    <script src="reserva.js"></script>
</body>
</html>
